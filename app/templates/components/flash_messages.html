{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="mx-auto w-full max-w-7xl px-4 pt-4 sm:px-6" aria-live="polite">
            {% for category, message in messages %}
                <div class="alert {{ 'alert-error' if category == 'error' else 'alert-success' }}" role="{{ 'alert' if category == 'error' else 'status' }}">
                    <svg class="h-5 w-5 shrink-0" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        {% if category == 'error' %}<path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.3 3.7 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z"/>{% else %}<path stroke-linecap="round" stroke-linejoin="round" d="m5 12 4 4L19 6"/>{% endif %}
                    </svg>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}
