{% macro avatar(user, class_name='learner-sidebar-avatar') -%}
    {% if user.profile_image %}
        <img class="{{ class_name }} user-avatar-image" src="{{ url_for('users.avatar_image', user_id=user.id) }}" alt="Profile photo of {{ user.full_name }}" loading="lazy" decoding="async">
    {% else %}
        <span class="{{ class_name }}" aria-label="No profile photo for {{ user.full_name }}">{{ user.full_name[:1]|upper }}</span>
    {% endif %}
{%- endmacro %}
