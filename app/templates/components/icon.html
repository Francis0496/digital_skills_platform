{% macro icon(name, class_name='ui-icon') -%}
<svg class="{{ class_name }}" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    {% if name == 'dashboard' %}<path stroke-linecap="round" stroke-linejoin="round" d="M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM4 14h6v6H4v-6Zm10 0h6v6h-6v-6Z"/>
    {% elif name == 'user' %}<path stroke-linecap="round" stroke-linejoin="round" d="M20 21a8 8 0 0 0-16 0m8-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/>
    {% elif name == 'skills' %}<path stroke-linecap="round" stroke-linejoin="round" d="m12 3 1.2 3.8L17 8l-3.8 1.2L12 13l-1.2-3.8L7 8l3.8-1.2L12 3Zm-6 9 .8 2.2L9 15l-2.2.8L6 18l-.8-2.2L3 15l2.2-.8L6 12Zm11 2 1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3Z"/>
    {% elif name == 'book' %}<path stroke-linecap="round" stroke-linejoin="round" d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5v-16ZM20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5v-16Z"/>
    {% elif name == 'folder' %}<path stroke-linecap="round" stroke-linejoin="round" d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/>
    {% elif name == 'briefcase' %}<path stroke-linecap="round" stroke-linejoin="round" d="M9 6V4h6v2m-11 4h16m-8 0v2m-7 7h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2Z"/>
    {% elif name == 'document' %}<path stroke-linecap="round" stroke-linejoin="round" d="M6 3h8l4 4v14H6V3Zm8 0v5h4M9 13h6m-6 4h6"/>
    {% elif name == 'users' %}<path stroke-linecap="round" stroke-linejoin="round" d="M16 20v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1m7-9a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm13 9v-1a4 4 0 0 0-3-3.87m-2-11.96a4 4 0 0 1 0 7.75"/>
    {% elif name == 'bell' %}<path stroke-linecap="round" stroke-linejoin="round" d="M15 17H9m9-2V11a6 6 0 1 0-12 0v4l-2 2h16l-2-2Zm-8 5h4"/>
    {% elif name == 'arrow' %}<path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"/>
    {% elif name == 'check' %}<path stroke-linecap="round" stroke-linejoin="round" d="m5 12 4 4L19 6"/>
    {% endif %}
</svg>
{%- endmacro %}
