{% extends "layouts/dashboard.html" %}{% block title %}Skill Management{% endblock %}{% block dashboard_content %}<div class="flex justify-between"><h1 class="text-3xl font-bold">Skills</h1><a class="btn-primary" href="{{ url_for('admin.create_skill') }}">New skill</a></div><div class="mt-6 space-y-3">{% for skill in skills %}<article class="card flex justify-between gap-4"><div><h2 class="font-bold">{{ skill.name }}</h2><p class="mt-1 text-sm text-slate-600">{{ skill.description or 'No description' }}</p></div><a class="btn-secondary" href="{{ url_for('admin.edit_skill',skill_id=skill.id) }}">Edit</a></article>{% else %}<div class="empty-state">No skills yet.</div>{% endfor %}</div>{% endblock %}
